<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mehfil</title>

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/room.css">

    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <div class="room-page">
        <header class="room-navbar">
            <div class="brand-wrapper">
                <a href="/">
                    <img src="/assets/neutral-logo.png" style="height:40px;" alt="Mehfil Logo">
                </a>
            </div>

            <div class="nav-actions">
                <div class="room-url-tag">
                    <span class="material-symbols-outlined">language</span>
                    <span id="room-code-display">mehfil.today/<b>test</b></span>
                </div>
            </div>
        </header>

        <main>
            <aside class="sidebar">
                <div class="current-playback">
                    <div class="current-video">
                        <div class="video-wrapper">
                            <iframe id="youtube-player-container" frameborder="0" allowfullscreen=""
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                referrerpolicy="strict-origin-when-cross-origin"
                                title="Janam Janam Full Video, Arijit Singh - Dilwale | Shah Rukh Khan | Kajol | Antara Mitra |Pritam"
                                width="100%" height="100%"
                                src="https://www.youtube.com/embed/?autoplay=1&amp;controls=1&amp;modestbranding=1&amp;rel=0&amp;enablejsapi=1&amp;origin=http%3A%2F%2F192.168.1.47%3A3000&amp;widgetid=1&amp;forigin=http%3A%2F%2F192.168.1.47%3A3000%2Froom%2FMEHFIL&amp;aoriginsup=1&amp;gporigin=http%3A%2F%2F192.168.1.47%3A3000%2F&amp;vf=6"></iframe>
                        </div>
                    </div>

                    <div class="current-info">
                        <h2 id="current-song-title">Naino Vale Ne Cheda Man Ka Pyala</h2>

                        <div class="current-song-source">
                            <span class="material-symbols-outlined">smart_display</span>
                            <span id="current-song-artist">Sony Music India</span>
                        </div>

                    </div>
                </div>

                <div id="queue-list" class="queue-container">
                    
                </div>
            </aside>

            <section class="content">
                <nav class="tabs">
                    <button class="tab-item active" role="tab" data-tab="youtube">
                        <span class="material-symbols-outlined">search</span>
                        Youtube
                    </button>

                    <button class="tab-item" role="tab" data-tab="users">
                        <span class="material-symbols-outlined">group</span>
                        Users
                    </button>
                </nav>

                <div class="content-body">
                    <div id="tab-youtube" class="tab-content" role="tabpanel">
                        <form class="search-input-wrapper" id="search-youtube">
                            <input type="text" placeholder="Enter URL or Song Name" name="query">

                            <button type="submit" id="btn-search-youtube">
                                <span class="material-symbols-outlined">search</span>
                            </button>
                        </form>



                        <div class="search-results" id="search-results" hidden>

                        </div>

                        <div id="youtube-initial-placeholder">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-youtube"
                                viewBox="0 0 16 16">
                                <path
                                    d="M8.051 1.999h.089c.822.003 4.987.033 6.11.335a2.01 2.01 0 0 1 1.415 1.42c.101.38.172.883.22 1.402l.01.104.022.26.008.104c.065.914.073 1.77.074 1.957v.075c-.001.194-.01 1.108-.082 2.06l-.008.105-.009.104c-.05.572-.124 1.14-.235 1.558a2.01 2.01 0 0 1-1.415 1.42c-1.16.312-5.569.334-6.18.335h-.142c-.309 0-1.587-.006-2.927-.052l-.17-.006-.087-.004-.171-.007-.171-.007c-1.11-.049-2.167-.128-2.654-.26a2.01 2.01 0 0 1-1.415-1.419c-.111-.417-.185-.986-.235-1.558L.09 9.82l-.008-.104A31 31 0 0 1 0 7.68v-.123c.002-.215.01-.958.064-1.778l.007-.103.003-.052.008-.104.022-.26.01-.104c.048-.519.119-1.023.22-1.402a2.01 2.01 0 0 1 1.415-1.42c.487-.13 1.544-.21 2.654-.26l.17-.007.172-.006.086-.003.171-.007A100 100 0 0 1 7.858 2zM6.4 5.209v4.818l4.157-2.408z" />
                            </svg>
                            
                            <p>Add music from youtube by searching for a song name, or by pasting a video or playlist URL</p>
                        </div>
                    </div>

                    <div id="tab-users" class="tab-content" role="tabpanel" hidden>
                        <div class="users-list">
                            <div class="user-row">
                                
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="player">
            <div class="global-progress-track">
                <div id="global-progress-fill" class="global-progress-fill" style="width: 32.8755%;"></div>
            </div>


            <div class="control-left">
                <button id="btn-power" class="btn-player">
                    <span class="material-symbols-outlined">power_settings_new</span>
                </button>
                <div style="height: 24px; width: 1px; background-color: var(--surface-border);"></div>
                <button class="btn-player">
                    <span class="material-symbols-outlined">volume_up</span>
                </button>
            </div>
            <div class="control-center">
                <button class="btn-player-sub">
                    <span class="material-symbols-outlined">skip_previous</span>
                </button>

                <button class="btn-player-play">
                    <span class="material-symbols-outlined filled-icon" style="font-size: 32px;">play_arrow</span>
                </button>

                <button class="btn-player-sub">
                    <span class="material-symbols-outlined">skip_next</span>
                </button>
            </div>
            <div class="control-right">
                <button class="btn-player">
                    <span class="material-symbols-outlined">desktop_windows</span>
                </button>

                <button class="btn-player">
                    <span class="material-symbols-outlined">repeat</span>
                </button>

                <button class="btn-player">
                    <span class="material-symbols-outlined">shuffle</span>
                </button>
            </div>
        </footer>
    </div>


    <script src="/js/room.js" type="module"></script>
</body>

</html>
